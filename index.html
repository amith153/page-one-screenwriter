<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page One</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,body{background:#0A0B0F;margin:0}
      /* Launch splash: the mark and the name, with a light sweeping across them left to right. */
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
        background:radial-gradient(90% 70% at 50% 42%,#171A23 0%,#0A0B0F 70%);transition:opacity .55s ease,visibility .55s;}
      #splash.light{background:radial-gradient(90% 70% at 50% 42%,#FFFDF9 0%,#F2EDE4 70%)}
      #splash.is-out{opacity:0;visibility:hidden}
      #splash .mark{position:relative;width:112px;height:112px;border-radius:26px;overflow:hidden;
        box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);animation:splash-in .7s cubic-bezier(.2,.9,.3,1.2) both}
      #splash .mark svg{display:block;width:100%;height:100%}
      #splash .mark::after{content:'';position:absolute;inset:-10% -60%;
        background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.08) 44%,rgba(255,250,235,.62) 50%,rgba(255,255,255,.08) 56%,transparent 62%);
        transform:translateX(-70%);animation:splash-shine 1.25s .35s cubic-bezier(.45,0,.2,1) 2 both}
      #splash .name{font:600 30px/1 'Fraunces Variable',Georgia,'Times New Roman',serif;letter-spacing:.01em;
        background:linear-gradient(105deg,#EDEBF2 0%,#EDEBF2 40%,#FFF6DF 50%,#E7B35A 53%,#EDEBF2 62%,#EDEBF2 100%);background-size:300% 100%;
        -webkit-background-clip:text;background-clip:text;color:transparent;
        animation:splash-in .7s .12s cubic-bezier(.2,.9,.3,1.2) both,splash-text 1.25s .45s cubic-bezier(.45,0,.2,1) 2 both}
      #splash.light .name{background-image:linear-gradient(105deg,#1B1A18 0%,#1B1A18 40%,#B98235 50%,#E7B35A 53%,#1B1A18 62%,#1B1A18 100%)}
      #splash .tag{font:500 12px/1 system-ui,'Segoe UI',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#6C7080;animation:splash-in .7s .25s ease both}
      @keyframes splash-in{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
      @keyframes splash-shine{to{transform:translateX(70%)}}
      @keyframes splash-text{from{background-position:100% 0}to{background-position:0 0}}
      @media (prefers-reduced-motion: reduce){#splash .mark::after,#splash .name{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark">
        <svg viewBox="0 0 100 100">
          <rect width="100" height="100" fill="#12141B" />
          <g transform="translate(50 50) scale(.8) translate(-48 -54)">
            <defs><clipPath id="splash-b"><circle cx="46" cy="52" r="30" /></clipPath></defs>
            <path fill="#E7B35A" d="M23 70 L9 86 L33 79 Z" />
            <circle cx="46" cy="52" r="30" fill="#F4EBDD" />
            <circle cx="68" cy="68" r="25" fill="#E7B35A" clip-path="url(#splash-b)" />
            <path fill="#CDB797" d="M50 48 V74 A26 26 0 0 1 24 48 Z" />
            <path fill="#B98235" d="M50 74 L43 74 L50 67 Z" />
            <path fill="#E7B35A" d="M73.6 36 L87 41 L74.4 46 Z" />
            <circle cx="61" cy="39" r="4.2" fill="#12141B" />
            <circle cx="62.3" cy="37.7" r="1.3" fill="#F4EBDD" />
          </g>
        </svg>
      </div>
      <div class="name">Page One</div>
      <div class="tag">Write the first page</div>
    </div>
    <script>
      // Match the writer's theme before anything else paints.
      try {
        var t = (JSON.parse(localStorage.getItem('pageone-settings') || '{}').theme) || 'dark'
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.getElementById('splash').className = 'light'
          document.documentElement.style.background = document.body.style.background = '#F2EDE4'
        }
      } catch (e) { /* storage blocked */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
