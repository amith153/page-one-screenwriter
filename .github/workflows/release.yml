name: Release builds

# Builds keyless installers (no server keys, no secrets) for Windows.
# Run it by hand from the Actions tab and give it a tag name such as v0.1.2; it attaches the installers to that release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Page One ${{ inputs.tag }}
          releaseBody: Keyless build (no Drive or film stills). See the README for what that means and how to build with your own keys.
          releaseDraft: false
